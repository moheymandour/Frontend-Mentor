<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Mentor | Blog preview card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main">
      <div class="illu-img">
        <img
          src="assets/images/illustration-article.svg"
          alt="illustration-article"
        />
      </div>
      <div class="info">
        <button>Learning</button>
        <p class="published-date">Published 21 Dec 2023</p>
        <h1 class="name-course">HTML & CSS foundations</h1>
        <p class="des-course">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>
      </div>
      <div class="creator-info">
        <div>
          <img src="assets/images/image-avatar.webp" alt="avatar" />
        </div>

        <p class="creator-name">Greg Hooper</p>
      </div>
    </div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://github.com/moheymandour/Frontend-Mentor">Mohey Mandour</a
      >.
    </footer>
  </body>
</html>
